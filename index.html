<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REXCORDS — Wear the track.</title>
<meta name="description" content="REXCORDS: limited caps, each built from the mood of a track. Wear the track.">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--bg2:#161618;--ink:#f3f0ea;--mute:#8d8a85;--red:#e5262b;--line:#2a2a2d;--gold:#e8b53a;
--h:'Archivo Black',Impact,sans-serif;--m:'Space Mono',ui-monospace,monospace;--b:'Archivo',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--b);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--h);text-transform:uppercase;line-height:.92;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,11.5vw,8rem)}h2{font-size:clamp(2rem,7vw,4.5rem)}h3{font-size:1.3rem}
.mono{font-family:var(--m);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.red{color:var(--red)}
header.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--h);font-size:1.3rem;text-decoration:none;letter-spacing:.02em}.logo b{color:var(--red)}
nav.links{display:flex;gap:26px;align-items:center}
nav.links a{font-family:var(--m);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
nav.links a:hover,nav.links a.on{border-color:var(--red)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--ink);width:44px;height:44px;font-size:1.2rem;cursor:pointer}
@media(max-width:820px){.burger{display:block}nav.links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid var(--line)}
nav.links.open{display:flex}nav.links a{padding:16px 20px;border-top:1px solid var(--line)}}
.btn{display:inline-block;font-family:var(--m);font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:15px 24px;min-height:48px;border:2px solid var(--ink);background:none;color:var(--ink);cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--red)}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.hero{padding:48px 0 70px;position:relative;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center}
@media(max-width:820px){.hero .grid{grid-template-columns:1fr}}
.hero p.lead{font-size:1.15rem;max-width:30ch;margin:22px 0 28px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.disc{aspect-ratio:1;max-width:440px;width:100%;margin:0 auto;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 6px,#1b1b1d 6px 7px);border:2px solid var(--line);display:grid;place-items:center;position:relative;animation:spin 24s linear infinite}
.disc .lab{width:38%;aspect-ratio:1;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:var(--h);font-size:.9rem}
.mascot{image-rendering:pixelated;display:block}
.disc-wrap{position:relative;max-width:440px;margin:0 auto}
.disc-wrap .mascot{position:absolute;inset:auto 0 -6% auto;width:58%;filter:drop-shadow(6px 6px 0 var(--red))}
@keyframes spin{to{transform:rotate(360deg)}}
.marquee{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:12px 0;background:var(--bg2)}
.marquee span{display:inline-block;animation:mq 28s linear infinite;font-family:var(--m);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
@keyframes mq{to{transform:translateX(-50%)}}
section.s{padding:84px 0;border-bottom:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px;border:1px solid var(--line)}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{padding:26px 20px;border:1px solid var(--line);min-height:210px;transition:background .2s}
.step:hover{background:var(--bg2)}.step .n{font-family:var(--h);font-size:3.6rem;color:var(--red);line-height:1}
.step svg{display:block;margin:10px 0;image-rendering:pixelated}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.ph{border:2px dashed var(--line);aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(45deg,transparent 48%,#1a1a1c 50%,transparent 52%) 0 0/20px 20px}
.statement{background:var(--red);color:#0b0b0c;padding:90px 0}
.statement h2{font-size:clamp(2.4rem,9vw,7rem)}
.drops{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
@media(max-width:820px){.drops{grid-template-columns:1fr}}
.drop{border:1px solid var(--line);padding:22px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.drop:nth-child(2){margin-top:30px}@media(max-width:820px){.drop:nth-child(2){margin-top:0}}
input,textarea,select{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:14px;font:inherit;border-radius:0;min-height:48px}
input:focus,textarea:focus,select:focus,.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label{display:block;font-family:var(--m);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 6px;color:var(--mute)}
.row{display:flex;gap:10px}.row input{flex:1}
.msg{margin-top:12px;font-family:var(--m);font-size:.8rem}.msg.ok{color:#5fd38d}.msg.err{color:var(--red)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:30px}
.card{text-decoration:none;border:1px solid var(--line);display:block;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--red)}
.card .im{aspect-ratio:1;background:var(--bg2) center/cover}.card .t{padding:14px}
.tag{display:inline-block;font-family:var(--m);font-size:.68rem;border:1px solid var(--red);color:var(--red);padding:2px 8px;text-transform:uppercase;letter-spacing:.1em}
.pill{display:inline-block;border:1px solid var(--line);padding:9px 14px;margin:0 8px 8px 0;font-family:var(--m);font-size:.8rem;background:none;color:var(--ink);cursor:pointer;min-height:44px}
.pill.on{background:var(--ink);color:var(--bg)}
.gal{display:grid;gap:10px}.gal img{width:100%;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.qty button{width:38px;height:38px;background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer}
footer{padding:60px 0 40px;background:var(--bg2)}footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
@media(max-width:820px){footer .cols{grid-template-columns:1fr 1fr}}
footer a{display:block;text-decoration:none;padding:5px 0;color:var(--mute)}footer a:hover{color:var(--ink)}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.hp{position:absolute;left:-9999px}
.adm{border:1px solid var(--line);padding:20px;margin-top:20px;background:var(--bg2)}
.cnt{background:var(--red);color:#fff;font-size:.7rem;padding:1px 6px;margin-left:4px}
</style></head><body>

V.shop=()=>{const L=pub();
 if(PRODUCTS===null)return `<div class="wrap" style="padding:80px 20px">Loading…</div>`;
 if(!L.length)return `<section class="s"><div class="wrap split"><div><div class="mono">Shop</div><h1 style="font-size:clamp(2.6rem,9vw,6rem)">No drops<br>available <span class="red">yet.</span></h1><p style="max-width:40ch;color:var(--mute)">The first collection is in preparation. When it lands, it will show up right here.</p><div class="btns"><a class="btn p" href="#/home-news" data-scroll="news">Get notified</a><a class="btn" href="#/">Back home</a></div></div><div style="max-width:320px;margin:auto">${rex()}</div></div></section><section class="s" id="news"><div class="wrap" style="max-width:560px"><h2 style="font-size:2rem">Join the list</h2>${newsletter()}</div></section>`;
 const cols=[...new Set(L.map(p=>p.collection).filter(Boolean))];
 return `<section class="s"><div class="wrap"><div class="mono">Shop</div><h2>The drops</h2>
 <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px"><select id="sf" aria-label="Collection" style="max-width:220px"><option value="">All collections</option>${cols.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
 <select id="ss" aria-label="Sort" style="max-width:220px"><option value="n">Newest</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div><div class="pgrid" id="pg"></div></div></section>`};
function fillGrid(){const g=$("#pg");if(!g)return;let L=pub();const f=$("#sf").value,s=$("#ss").value;if(f)L=L.filter(p=>p.collection===f);
 if(s=="a")L.sort((a,b)=>a.price-b.price);if(s=="d")L.sort((a,b)=>b.price-a.price);
 g.innerHTML=L.map(p=>{const out=!(p.inventory>0);return `<a class="card" href="#/product/${esc(p.slug)}"><div class="im" role="img" aria-label="${esc(p.name)}" style="background-image:url('${esc((p.images||[])[0]||"")}')"></div><div class="t"><strong>${esc(p.name)}</strong><br>${money(p.price)} ${out?'<span class="tag">Sold out</span>':""}</div></a>`}).join("")}
V.product=slug=>{if(PRODUCTS===null)return `<div class="wrap" style="padding:80px 20px">Loading…</div>`;const p=pub().find(x=>x.slug===slug);
 if(!p)return `<section class="s"><div class="wrap"><h2>Not found</h2><p>This product doesn't exist or isn't published.</p><a class="btn" href="#/shop">Back to shop</a></div></section>`;
 document.title=(p.seoTitle||p.name)+" — REXCORDS";const sz=(p.sizes||"").split(",").map(s=>s.trim()).filter(Boolean),co=(p.colors||"").split(",").map(s=>s.trim()).filter(Boolean),out=!(p.inventory>0);
 return `<section class="s"><div class="wrap split" style="align-items:start"><div class="gal">${(p.images||[]).map(u=>`<img src="${esc(u)}" alt="${esc(p.name)}" loading="lazy">`).join("")}</div>
 <div><div class="mono">${esc(p.collection||"")}</div><h1 style="font-size:clamp(2.2rem,7vw,4.5rem)">${esc(p.name)}</h1><p style="font-size:1.4rem;font-family:var(--m)">${money(p.price)}</p>
 <p>${esc(p.description)}</p>${p.track?`<div class="mono">Inspired by</div><p>${esc(p.track)}</p>`:""}${p.story?`<div class="mono">Story</div><p>${esc(p.story)}</p>`:""}${p.material?`<div class="mono">Material</div><p>${esc(p.material)}</p>`:""}
 ${co.length?`<div class="mono">Color</div><div data-g="c">${co.map((c,i)=>`<button class="pill ${i?"":"on"}">${esc(c)}</button>`).join("")}</div>`:""}
 ${sz.length?`<div class="mono">Size</div><div data-g="s">${sz.map((c,i)=>`<button class="pill ${i?"":"on"}">${esc(c)}</button>`).join("")}</div>`:""}
 <p class="mono">${out?"Sold out":p.inventory<=5?"Only "+p.inventory+" left":"In stock"}</p><button class="btn p" id="add" data-id="${esc(p.id)}" ${out?"disabled":""}>Add to cart</button><div class="msg ok" id="am"></div></div></div></section>`};
V.cart=()=>{if(!CART.length)return `<section class="s"><div class="wrap"><h2>Your cart is empty</h2><p style="color:var(--mute)">Nothing here yet.</p><a class="btn p" href="#/shop">Go to shop</a></div></section>`;
 const items=CART.map((i,ix)=>{const p=(PRODUCTS||[]).find(x=>x.id===i.id);return p?{...i,p,ix}:null}).filter(Boolean);const sub=items.reduce((a,i)=>a+i.p.price*i.q,0);
 return `<section class="s"><div class="wrap"><h2>Cart</h2><div style="overflow-x:auto"><table><tbody>${items.map(i=>`<tr><td><strong>${esc(i.p.name)}</strong><br><span class="mono">${esc([i.c,i.s].filter(Boolean).join(" / "))}</span></td><td class="qty"><button data-q="${i.ix}" data-d="-1" aria-label="Less">−</button> ${i.q} <button data-q="${i.ix}" data-d="1" aria-label="More">+</button></td><td>${money(i.p.price*i.q)}</td><td><button class="pill" data-rm="${i.ix}">Remove</button></td></tr>`).join("")}</tbody></table></div>
 <h3 style="margin:24px 0">Subtotal ${money(sub)}</h3><button class="btn p" id="co" ${CONFIG.checkout.provider?"":"disabled"}>Checkout</button>${CONFIG.checkout.provider?"":`<p class="mono">Checkout is not connected yet. No orders can be placed.</p>`}</div></section>`};
V.about=()=>`<section class="s"><div class="wrap split"><div><div class="mono">About</div><h1 style="font-size:clamp(2.6rem,9vw,6rem)">A label.<br>For <span class="red">caps.</span></h1></div><div style="max-width:46ch">${rex("200px")}
<p>REXCORDS turns the mood of a track into an original cap. We pull out the palette, pick one symbol, and make a limited run.</p><p>Every drop should feel like a record release: a distinct concept, a strong identity, and a pressing that doesn't last.</p><p>REX is the MC behind it all. Gold tooth, red shades, always at the mic.</p><p style="color:var(--mute)">Our designs are original, inspired by a track's feeling, never copied artwork.</p></div></div></section>`;
V.sound=()=>`<section class="s"><div class="wrap"><div class="mono">The REXCORDS sound</div><h2>Music first.<br>Then the cap.</h2><div class="drops" style="margin-top:40px">${["House & tech house","Hip-hop","Electronic"].map(g=>`<div class="drop"><span class="mono">Mood</span><h3>${g}</h3></div>`).join("")}</div>
<h3 style="margin:50px 0 14px">Playlists</h3>${CONFIG.playlists.length?CONFIG.playlists.map(p=>`<p><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></p>`).join(""):`<p style="color:var(--mute)">Playlists, collab stories and drop breakdowns will live here.</p>`}</div></section>`;
V.contact=()=>`<section class="s"><div class="wrap" style="max-width:640px"><div class="mono">Contact</div><h2>Say hi</h2><form id="cf" novalidate><label for="cn">Name</label><input id="cn" required autocomplete="name"><label for="ce">Email</label><input id="ce" type="email" required autocomplete="email"><label for="cs">Subject</label><input id="cs" required><label for="cm">Message</label><textarea id="cm" rows="6" required></textarea><input class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" id="ch"><p><button class="btn p">Send</button></p><div class="msg" role="status"></div></form></div></section>`;
V.legal=k=>`<section class="s"><div class="wrap" style="max-width:640px"><h2>${esc(k||"Legal")}</h2><p style="color:var(--mute)">Placeholder: add your ${esc(k)} text here before launch (edit V.legal in the file).</p></div></section>`;
V.admin=()=>{const ok=USER&&USER.canEdit&&USER.canEdit();if(!DB||!ok)return `<section class="s"><div class="wrap"><h2>Admin</h2><p>Sign in as the page owner or an editor to manage products.</p></div></section>`;
 return `<section class="s"><div class="wrap"><div class="mono">Admin</div><h2>Products</h2><div id="al"></div><div class="adm"><h3 id="at">New product</h3><form id="pf"><input type="hidden" id="f_id">
 ${[["name","Name"],["slug","URL slug"],["price","Price (EGP)","number"],["inventory","Inventory","number"],["collection","Collection"],["track","Track inspiration"],["colors","Colors (comma separated)"],["sizes","Sizes (comma separated)"],["material","Material & construction"],["seoTitle","SEO title"],["seoDesc","SEO description"]].map(f=>`<label for="f_${f[0]}">${f[1]}</label><input id="f_${f[0]}" type="${f[2]||"text"}">`).join("")}
 <label for="f_description">Description</label><textarea id="f_description" rows="3"></textarea><label for="f_story">Story</label><textarea id="f_story" rows="3"></textarea>
 <label for="f_images">Images (URLs, one per line)</label><textarea id="f_images" rows="3"></textarea><label for="f_up">Or upload images</label><input id="f_up" type="file" accept="image/*" multiple>
 <label for="f_status">Status</label><select id="f_status"><option value="draft">Draft (hidden)</option><option value="published">Published</option></select>
 <label><input type="checkbox" id="f_featured" style="width:auto;min-height:0"> Featured</label><p><button class="btn p">Save product</button> <button type="button" class="btn" id="fnew">Clear</button></p><div class="msg" id="pm"></div></form></div></div></section>`};
async function adminList(){const el=$("#al");if(!el)return;await refresh();el.innerHTML=PRODUCTS.length?`<table>${PRODUCTS.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="tag">${esc(p.status)}</span></td><td>${money(p.price||0)}</td><td><button class="pill" data-ed="${p.id}">Edit</button><button class="pill" data-tg="${p.id}">${p.status==="published"?"Unpublish":"Publish"}</button><button class="pill" data-dl="${p.id}">Delete</button></td></tr>`).join("")}</table>`:`<p style="color:var(--mute)">No products yet. Use the form below.</p>`}
async function refresh(){const s=await DB.collection("products").get();PRODUCTS=s.docs.map(d=>({id:d.id,...d.data()}))}
/* ============ Router ============ */
function render(){const h=(location.hash||"#/").slice(2).split("/"),r=h[0]||"home",app=$("#app");document.title="REXCORDS — Wear the track.";
 const fn=V[r]||(()=>`<section class="s"><div class="wrap"><h2>404</h2><a class="btn" href="#/">Home</a></div></section>`);app.innerHTML=fn(h[1]);
 $("#links").classList.remove("open");document.querySelectorAll("#links a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+r));
 window.scrollTo(0,0);saveCart();bind();fillGrid();if(r==="admin")adminList();
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".rv").forEach(e=>io.observe(e))}
function status(f,t,ok){const m=f.querySelector(".msg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
const emailOk=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
async function submit(col,d,f,okMsg){
 if(!CONFIG.email)return status(f,"Not connected yet: add your email or a form service in CONFIG so submissions can be received.");
 const body=Object.entries(d).filter(x=>x[0]!=="kind").map(x=>x[0]+": "+x[1]).join("%0D%0A");
 location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(d.subject||"REXCORDS "+d.kind)+"&body="+body;status(f,"Opening your email app to send this.",1)}
function bind(){
 document.querySelectorAll("form.nl").forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=f.querySelector("input[type=email]").value.trim();if(f.querySelector(".hp").value)return;if(!emailOk(v))return status(f,"Enter a valid email.");submit("inbox",{kind:"newsletter",email:v},f,"You're on the list.")});
 const cf=$("#cf");if(cf)cf.onsubmit=e=>{e.preventDefault();if($("#ch").value)return;const d={kind:"contact",name:$("#cn").value.trim(),email:$("#ce").value.trim(),subject:$("#cs").value.trim(),message:$("#cm").value.trim()};
  if(!d.name||!d.subject||!d.message||!emailOk(d.email))return status(cf,"Please fill in every field with a valid email.");submit("inbox",d,cf,"Message sent. Thank you.")};
 document.querySelectorAll("[data-scroll]").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.scroll);if(t)t.scrollIntoView({behavior:"smooth"});else{location.hash="#/";setTimeout(()=>document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:"smooth"}),50)}});
 const sf=$("#sf");if(sf){sf.onchange=fillGrid;$("#ss").onchange=fillGrid}
 document.querySelectorAll("[data-g]").forEach(g=>g.onclick=e=>{if(e.target.classList.contains("pill")){g.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));e.target.classList.add("on")}});
 const add=$("#add");if(add)add.onclick=()=>{const g=k=>document.querySelector(`[data-g=${k}] .on`)?.textContent||"";const id=add.dataset.id,c=g("c"),s=g("s"),p=PRODUCTS.find(x=>x.id===id);
  const ex=CART.find(i=>i.id===id&&i.c===c&&i.s===s);if((ex?ex.q:0)+1>p.inventory)return $("#am").textContent="No more stock available.";ex?ex.q++:CART.push({id,c,s,q:1});saveCart();$("#am").textContent="Added to cart."};
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const i=CART[b.dataset.q],p=PRODUCTS.find(x=>x.id===i.id);i.q+=+b.dataset.d;if(i.q>p.inventory)i.q=p.inventory;if(i.q<1)CART.splice(b.dataset.q,1);render()});
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{CART.splice(b.dataset.rm,1);render()});
 const pf=$("#pf");if(pf)adminBind(pf)}
function adminBind(pf){const F=k=>$("#f_"+k),keys=["name","slug","collection","track","colors","sizes","material","seoTitle","seoDesc","description","story","status"];
 const clear=()=>{pf.reset();F("id").value="";$("#at").textContent="New product"};$("#fnew").onclick=clear;
 $("#al").onclick=async e=>{const t=e.target,id=t.dataset.ed||t.dataset.tg||t.dataset.dl;if(!id)return;const p=PRODUCTS.find(x=>x.id===id);
  if(t.dataset.ed){F("id").value=id;keys.forEach(k=>F(k).value=p[k]||"");F("price").value=p.price;F("inventory").value=p.inventory;F("images").value=(p.images||[]).join("\n");F("featured").checked=!!p.featured;$("#at").textContent="Edit product";pf.scrollIntoView()}
  if(t.dataset.tg){await DB.collection("products").doc(id).update({status:p.status==="published"?"draft":"published"});adminList()}
  if(t.dataset.dl&&confirm("Delete this product permanently?")){await DB.collection("products").doc(id).delete();adminList()}};
 pf.onsubmit=async e=>{e.preventDefault();const m=$("#pm");try{let imgs=F("images").value.split("\n").map(s=>s.trim()).filter(Boolean);const up=F("up").files;
  if(up.length){const a=await claude.use("assets");if(!a)throw new Error("Image upload unavailable; paste image URLs instead.");for(const f of up){const r=await a.upload(f);imgs.push(r.url)}}
  const d={price:+F("price").value||0,inventory:+F("inventory").value||0,featured:F("featured").checked,images:imgs};keys.forEach(k=>d[k]=F(k).value.trim());
  if(!d.name)throw new Error("Name is required.");d.slug=(d.slug||d.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const id=F("id").value;if(id)await DB.collection("products").doc(id).set(d);else await DB.collection("products").add(d);
  m.textContent="Saved.";m.className="msg ok";clear();adminList()}catch(x){m.textContent=x.message||"Save failed.";m.className="msg err"}}}
/* ============ Boot ============ */
$("#burger").onclick=()=>{const o=$("#links").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$("#socials").innerHTML=Object.entries(CONFIG.socials).filter(s=>s[1]).map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${s[0]}</a>`).join("")||`<span style="color:var(--mute)">Links coming soon</span>`;
if(CONFIG.email){const a=$("#fmail");a.href="mailto:"+CONFIG.email;a.textContent=CONFIG.email}
window.addEventListener("hashchange",render);render();init();
</script></body></html>
